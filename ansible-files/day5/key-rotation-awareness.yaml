---
- name: Check Customer Managed Key Rotation
  hosts: app
  gather_facts: false
  become: false

  vars_files:
    - /home/azureuser/az-platform-eng-bootcamp/ansible-files/day5/vars.yaml

  tasks:

    #########################################################
    # Deploy Rotation Check Script
    #########################################################

    - name: Deploy Rotation Check Script
      ansible.builtin.template:
        src: /home/azureuser/az-platform-eng-bootcamp/ansible-files/day5/key-rotation-check.sh.j2
        dest: /home/azureuser/key-rotation-check.sh
        mode: "0755"
      delegate_to: localhost

    #########################################################
    # Execute Rotation Check
    #########################################################

    - name: Execute Rotation Check
      ansible.builtin.command: /home/azureuser/key-rotation-check.sh
      delegate_to: localhost
      register: rotation_output
      changed_when: false

    #########################################################
    # Display Rotation Report
    #########################################################

    - name: Display Rotation Report
      ansible.builtin.debug:
        msg: "{{ rotation_output.stdout_lines }}"

    #########################################################
    # Configure Daily Cron Job
    #########################################################

    - name: Configure Daily Rotation Check
      ansible.builtin.cron:
        name: "Azure CMK Rotation Check"
        minute: "0"
        hour: "2"
        job: "/home/azureuser/key-rotation-check.sh >> /home/azureuser/key-rotation.log 2>&1"
      delegate_to: localhost